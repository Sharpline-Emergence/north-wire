name: Update North Wire feed
on:
  workflow_dispatch: {}   # triggered externally by cron-job.org, or manually from the Actions tab
concurrency:
  group: north-wire-feed-update
  cancel-in-progress: false   # let an in-progress run finish rather than killing it mid-commit
permissions:
  contents: write
jobs:
  update-articles:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt
      - name: Fetch, dedupe, and filter today's articles
        run: python3 pipeline/fetch_feeds.py --config pipeline/feeds_config.json --out articles.json
      - name: Commit and push if anything changed
        run: |
          git config user.name "north-wire-bot"
          git config user.email "actions@github.com"
          git add articles.json
          git diff --cached --quiet || git commit -m "Auto-update articles $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
